<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      {{ 'feed.title' | translate }}
    </ion-title>
  </ion-toolbar>
  
  <!-- Feed Selection Segment in Header -->
  <ion-toolbar>
    <ion-segment 
      [(ngModel)]="selectedFeed" 
      (ionChange)="onFeedChange($event)"
      class="feed-segment">
      <ion-segment-button value="clubs">
        <ion-label>{{ 'feed.clubs' | translate }}</ion-label>
      </ion-segment-button>
      <ion-segment-button value="look">
        <ion-label>{{ 'feed.look' | translate }}</ion-label>
      </ion-segment-button>
      <ion-segment-button value="discover">
        <ion-label>{{ 'feed.discover' | translate }}</ion-label>
      </ion-segment-button>
    </ion-segment>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <!-- Header spacer to push content below the translucent header -->
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">{{ 'feed.title' | translate }}</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <div class="feed-container">
    <app-post 
      *ngFor="let post of displayedPosts; trackBy: trackByPostId" 
      [post]="post">
    </app-post>
    
    <!-- Empty State -->
    <div *ngIf="displayedPosts.length === 0" class="empty-state">
      <ion-icon name="newspaper-outline" color="medium"></ion-icon>
      <h3>{{ 'feed.no_posts' | translate }}</h3>
      <p>No posts available in this feed yet.</p>
    </div>
  </div>

  <!-- Infinite Scroll -->
  <ion-infinite-scroll 
    #infiniteScroll
    threshold="100px" 
    (ionInfinite)="loadMore($event)">
    <ion-infinite-scroll-content
      loadingSpinner="bubbles"
      [loadingText]="'feed.loading_more' | translate">
    </ion-infinite-scroll-content>
  </ion-infinite-scroll>

  <!-- Floating Action Button -->
  <ion-fab slot="fixed" vertical="bottom" horizontal="end">
    <ion-fab-button (click)="createPost()">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
